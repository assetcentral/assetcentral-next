<!doctype html>
<html>
<head><title>Form schema</title></head>
<body>
<!--
  Netlify Forms requires a static HTML form definition at deploy time to detect
  field schema. The React forms in components/marketing/{LeadCapture,InlineNewsletter,LeadMagnetForm}.tsx
  and components/calculators/SaveResultForm.tsx all post to the same "lead" form;
  this file just registers the full schema (every possible field).
-->
<form name="lead" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="lead" />
  <input type="text" name="bot-field" />
  <input type="email" name="email" />
  <select name="portfolio_size">
    <option value="1">Just my home</option>
    <option value="2-5">2–5 properties</option>
    <option value="6-15">6–15 properties</option>
    <option value="16-50">16–50 properties</option>
    <option value="50+">50+ properties</option>
    <option value="newsletter-inline">newsletter-inline</option>
    <option value="calculator-save">calculator-save</option>
  </select>
  <input type="text" name="lead_magnet" />
  <textarea name="result_summary"></textarea>
</form>

<!--
  Dubai broker partner program — submitted from /partners/dubai-brokers.
  Schema registered here so Netlify accepts the full payload even though
  the React form is in a statically-exported page route.
-->
<form name="dubai-brokers-partner" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="dubai-brokers-partner" />
  <input type="text"  name="bot-field" />
  <input type="text"  name="first_name" />
  <input type="text"  name="last_name" />
  <input type="text"  name="agency" />
  <input type="email" name="email" />
  <input type="tel"   name="phone" />
  <input type="text"  name="client_count" />
  <input type="text"  name="client_profile" />
  <select name="partner_type">
    <option value="referral">Referral Partner</option>
    <option value="agency">Agency Partner</option>
    <option value="portfolio_review">Portfolio Review Partner</option>
    <option value="strategic">Strategic Partner</option>
    <option value="not_sure">Not sure yet — open to a conversation</option>
  </select>
  <textarea name="message"></textarea>
</form>

<!--
  Free first-client portfolio review — DECOMMISSIONED.
  Previously a Netlify Forms target; now posts to
  app.assetcentral.ai/api/partner/apply via FreePortfolioReviewForm.tsx
  so leads land in public.partner_applications with
  partner_type='portfolio_review'. Schema entry removed to stop
  Netlify auto-discovering and re-binding the form.
-->
</body>
</html>
